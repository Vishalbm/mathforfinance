name: Reproduce "The Hedge That Leaked"
on:
  push:
    paths: ["articles/the-hedge-that-leaked/**", "data/raw/**"]
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r articles/the-hedge-that-leaked/requirements-lock.txt
      - run: |
          python articles/the-hedge-that-leaked/src/validate_cf.py
          python articles/the-hedge-that-leaked/src/experiment.py
          python articles/the-hedge-that-leaked/src/validation.py
      - name: Results must match the committed numbers
        run: |
          python - <<'PY'
          import io, json, subprocess, pandas as pd
          git = lambda p: subprocess.check_output(["git", "show", "HEAD:" + p])
          new = json.load(open("data/derived/validation_summary.json"))
          old = json.loads(git("data/derived/validation_summary.json"))
          assert new.pop("pnl_decomposition_max_gap_usd") < 1e-3; old.pop("pnl_decomposition_max_gap_usd")
          bad = []
          def cmp(a, b, path=""):
              if isinstance(a, dict):
                  for k in set(a) | set(b): cmp(a.get(k), b.get(k), f"{path}/{k}")
              elif isinstance(a, (int, float)) and isinstance(b, (int, float)):
                  # summary statistics are rounded to 2 decimals; allow small floating-point drift across machines
                  if abs(a - b) > 0.05 + 1e-3 * abs(b): bad.append(f"{path}: {b} -> {a}")
              elif a != b: bad.append(f"{path}: {b} -> {a}")
          cmp(new, old)
          a = pd.read_csv("data/derived/daily_hedge_pnl.csv")
          b = pd.read_csv(io.BytesIO(git("data/derived/daily_hedge_pnl.csv")))
          gap = (a.pnl - b.pnl).abs().max()
          print("largest daily P&L difference vs committed: $%.2f" % gap)
          if gap > 100: bad.append(f"daily hedge P&L moved by ${gap:,.0f}")
          print("\n".join(bad) if bad else "Reproduced: all checks match the committed results.")
          assert not bad, "results differ from the committed numbers"
          PY
